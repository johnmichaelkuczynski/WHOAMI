openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discovery
    description: Career exploration and saved profile
  - name: auth
    description: Google sign-in and account session
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/google:
    get:
      operationId: beginGoogleLogin
      tags: [auth]
      summary: Begin Google OAuth sign-in
      responses:
        "302":
          description: Redirects to Google's OAuth authorization page
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      tags: [auth]
      summary: Complete Google OAuth sign-in
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Establishes a signed-in session and redirects to the app
        "401":
          description: OAuth response could not be verified
  /auth/me:
    get:
      operationId: getSignedInUser
      tags: [auth]
      summary: Get the signed-in Google account
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          description: No valid sign-in session
  /auth/logout:
    post:
      operationId: endGoogleLogin
      tags: [auth]
      summary: End the current sign-in session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "401":
          description: No valid sign-in session
  /discovery/dashboard:
    get:
      operationId: getDiscoveryDashboard
      tags: [discovery]
      summary: Get career exploration overview
      responses:
        "200":
          description: Overview and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /discovery/fresh-start:
    post:
      operationId: startFreshDiscovery
      tags: [discovery]
      summary: Start a blank workspace while preserving past conversations
      responses:
        "200":
          description: Fresh workspace profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
  /discovery/profile:
    get:
      operationId: getCareerProfile
      tags: [discovery]
      summary: Get evolving career profile
      responses:
        "200":
          description: Personal career profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
    patch:
      operationId: updateCareerProfile
      tags: [discovery]
      summary: Update profile notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
  /discovery/conversations:
    get:
      operationId: listCareerConversations
      tags: [discovery]
      summary: List saved reflection conversations
      responses:
        "200":
          description: Saved conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerConversation"
    post:
      operationId: createCareerConversation
      tags: [discovery]
      summary: Start a reflection conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: New conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerConversation"
  /discovery/conversations/{id}/messages:
    get:
      operationId: listCareerMessages
      tags: [discovery]
      summary: List messages in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerMessage"
    post:
      operationId: sendCareerMessage
      tags: [discovery]
      summary: Send a reflection message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: User message and AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExchange"
  /discovery/transcribe:
    post:
      operationId: transcribeVoice
      tags: [discovery]
      summary: Transcribe a recorded voice message
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/mp4:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/ogg:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/wav:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/AudioRecording"
      responses:
        "200":
          description: Recognized speech
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          description: No usable audio was received
        "415":
          description: Audio format is not supported
        "502":
          description: Transcription service failed
  /discovery/conversations/{id}/summary:
    post:
      operationId: summarizeCareerConversation
      tags: [discovery]
      summary: Summarize a conversation and update the profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved conversation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
  /discovery/assessments:
    get:
      operationId: listAssessmentResults
      tags: [discovery]
      summary: List saved assessment scores
      responses:
        "200":
          description: Assessment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResult"
  /discovery/assessments/start:
    post:
      operationId: startAssessment
      tags: [discovery]
      summary: Create a rotating exploratory assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentStartInput"
      responses:
        "201":
          description: Assessment questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSession"
  /discovery/assessments/{id}/submit:
    post:
      operationId: submitAssessment
      tags: [discovery]
      summary: Score and save an assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAnswers"
      responses:
        "201":
          description: Saved assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
  /discovery/recommendations:
    get:
      operationId: listCareerRecommendations
      tags: [discovery]
      summary: List saved book and activity recommendations
      responses:
        "200":
          description: Career exploration recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerRecommendation"
    post:
      operationId: generateCareerRecommendations
      tags: [discovery]
      summary: Generate fresh book and activity recommendations
      responses:
        "201":
          description: New recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerRecommendation"
  /discovery/recommendations/{id}:
    patch:
      operationId: updateCareerRecommendation
      tags: [discovery]
      summary: Update recommendation status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationUpdate"
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRecommendation"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthenticatedUser:
      type: object
      required: [email, name, picture]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        picture: { type: ["string", "null"], format: uri }
    LogoutResult:
      type: object
      required: [loggedOut]
      properties:
        loggedOut: { type: boolean }
    AudioRecording:
      type: string
      description: Raw audio bytes sent with an audio content type.
    TranscriptionResult:
      type: object
      required: [text]
      properties:
        text: { type: string }
    CareerProfile:
      type: object
      required: [id, summary, strengths, interests, workPreferences, updatedAt]
      properties:
        id: { type: integer }
        summary: { type: string }
        strengths: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        workPreferences: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      properties:
        summary: { type: string }
        strengths: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        workPreferences: { type: array, items: { type: string } }
    CareerConversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        archived: { type: boolean }
        summary: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
    CareerMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
    MessageExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: "#/components/schemas/CareerMessage" }
        assistantMessage: { $ref: "#/components/schemas/CareerMessage" }
    ConversationSummary:
      type: object
      required: [conversationId, summary, profile]
      properties:
        conversationId: { type: integer }
        summary: { type: string }
        profile: { $ref: "#/components/schemas/CareerProfile" }
    AssessmentStartInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [interests, personality, riasec, ipip] }
        verificationRun:
          type: boolean
          description: Development-only marker used to keep QA answers out of the evolving profile.
    AssessmentQuestion:
      type: object
      required: [id, prompt, trait]
      properties:
        id: { type: string }
        prompt: { type: string }
        trait: { type: string }
        keying: { type: string, enum: [positive, reverse] }
    AssessmentSession:
      type: object
      required: [id, kind, questions, verificationRun]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [interests, personality, riasec, ipip] }
        verificationRun: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/AssessmentQuestion" }
    AssessmentAnswer:
      type: object
      required: [questionId, score]
      properties:
        questionId: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
    AssessmentAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/AssessmentAnswer" }
    TraitScore:
      type: object
      required: [trait, score]
      properties:
        trait: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
    AssessmentResult:
      type: object
      required: [id, kind, questions, answers, scores, completedAt, verificationRun]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [interests, personality, riasec, ipip] }
        verificationRun: { type: boolean }
        profileUpdated: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/AssessmentQuestion" }
        answers:
          type: array
          items: { $ref: "#/components/schemas/AssessmentAnswer" }
        scores:
          type: array
          items: { $ref: "#/components/schemas/TraitScore" }
        completedAt: { type: string, format: date-time }
    CareerRecommendation:
      type: object
      required: [id, kind, title, reason, status, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [book, activity] }
        title: { type: string }
        reason: { type: string }
        status: { type: string, enum: [new, saved, tried, dismissed] }
        createdAt: { type: string, format: date-time }
    RecommendationUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, saved, tried, dismissed] }
    RecentActivity:
      type: object
      required: [kind, label, createdAt]
      properties:
        kind: { type: string, enum: [conversation, assessment, recommendation] }
        label: { type: string }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [profile, conversationCount, assessmentCount, recommendationCount, latestSummary, recentActivity]
      properties:
        profile: { $ref: "#/components/schemas/CareerProfile" }
        conversationCount: { type: integer }
        assessmentCount: { type: integer }
        recommendationCount: { type: integer }
        latestSummary: { type: ["string", "null"] }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/RecentActivity" }

